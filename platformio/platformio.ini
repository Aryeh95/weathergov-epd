; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = dfrobot_firebeetle2_esp32e
; default_envs = firebeetle32


; default options for each '[env:**]'
[env]
platform = espressif32 @ 6.13.0
framework = arduino
build_unflags = '-std=gnu++11'
; ARDUINOJSON_ENABLE_COMMENTS lets data/config.json carry // and /* */ comments
; documenting each setting. It must be defined globally rather than in a single
; source file, because ArduinoJson folds this option into its namespace name.
build_flags = '-Wall' '-std=gnu++17' '-D ARDUINOJSON_ENABLE_COMMENTS=1'
; data/config.json (WiFi, location, time, battery, widget layout) is loaded
; at boot from LittleFS. After editing data/config.json, run
; `pio run --target uploadfs` to push it to the device -- no firmware
; recompile/reflash needed.
board_build.filesystem = littlefs
lib_deps =
  adafruit/Adafruit BME280 Library @ 2.3.0
  adafruit/Adafruit BME680 Library @ 2.0.6
  adafruit/Adafruit BusIO @ 1.17.4
  adafruit/Adafruit Unified Sensor @ 1.1.15
  bblanchon/ArduinoJson @ 7.4.3
  zinggjm/GxEPD2 @ 1.6.8
  adafruit/Adafruit SHT4x Library @ 1.0.5


[env:dfrobot_firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = partitions_ota_4mb.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L


; Seeed reTerminal E1002 -- ESP32-S3 (XIAO ESP32S3 module) driving a built-in
; 7.3in Spectra 6 panel (GDEP073E01, same driver as DISP_7C_E6). The
; BOARD_RETERMINAL_E1002 flag selects the panel, onboard SHT4x sensor, and
; pin mapping automatically (see config.h / config.cpp), so no file edits are
; needed to build for this device: pio run -e seeed_reterminal_e1002
[env:seeed_reterminal_e1002]
board = seeed_xiao_esp32s3
monitor_speed = 115200
board_build.partitions = partitions_ota_8mb.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L
; ARDUINO_USB_CDC_ON_BOOT=0: route Serial to UART0 (GPIO43/44), which the
; E1002 wires to its CH340 USB-serial bridge -- the XIAO board definition
; would otherwise send Serial to native USB-CDC where nothing listens.
build_flags = ${env.build_flags} '-D BOARD_RETERMINAL_E1002' '-D ARDUINO_USB_CDC_ON_BOOT=0'

; Seeed reTerminal E1001: the same E-series mainboard as the E1002 (so it
; keeps the BOARD_RETERMINAL_E1002 flag for every shared pin/sensor/button
; quirk) but with a 7.5in 800x480 MONOCHROME panel; the extra E1001 flag
; only switches the panel selection to DISP_BW_V2 (see config.h).
; pio run -e seeed_reterminal_e1001
[env:seeed_reterminal_e1001]
board = seeed_xiao_esp32s3
monitor_speed = 115200
board_build.partitions = partitions_ota_8mb.csv
board_build.f_cpu = 80000000L
build_flags = ${env.build_flags} '-D BOARD_RETERMINAL_E1002' '-D BOARD_RETERMINAL_E1001' '-D ARDUINO_USB_CDC_ON_BOOT=0'


[env:firebeetle32]
board = firebeetle32
monitor_speed = 115200
; override default partition table
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
board_build.partitions = partitions_ota_4mb.csv
; change MCU frequency, 240MHz -> 80MHz (for better power efficiency)
board_build.f_cpu = 80000000L

