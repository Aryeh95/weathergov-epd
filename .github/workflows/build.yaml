name: PlatformIO CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, ee02-gdeb0709e01 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # The parts of the firmware that do not need the hardware, compiled and
  # run on the build machine with the sanitizers on.
  host-tests:
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: -std=gnu++17 -fsanitize=address,undefined -fno-sanitize-recover=all
    steps:
      - uses: actions/checkout@v4
      - name: Date formatter
        working-directory: tools/strftime_test
        run: |
          g++ $CXXFLAGS -I. -I../../platformio/include \
            strftime_test.cpp ../../platformio/src/_strftime.cpp -o strftime_test
          ./strftime_test
      - name: Daily precipitation
        working-directory: tools/precip_test
        run: |
          g++ $CXXFLAGS -I../../platformio/include -I. \
            precip_test.cpp ../../platformio/src/precip.cpp -o precip_test
          ./precip_test
      - name: Firmware target scanner
        working-directory: tools/ota_target_test
        run: |
          g++ $CXXFLAGS -I../../platformio/include \
            ota_target_test.cpp -o ota_target_test
          ./ota_target_test

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dfrobot_firebeetle2_esp32e, seeed_reterminal_e1002, seeed_reterminal_e1001, firebeetle32,
              seeed_xiao_ee02_709, seeed_xiao_ee02_709_testcard]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ matrix.env }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build PlatformIO Project
        run: pio run -d platformio -e ${{ matrix.env }}
